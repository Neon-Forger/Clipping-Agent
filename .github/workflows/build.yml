name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/clipcartel.keystore
          KEYSTORE_PASSWORD: clipcartel
          KEY_ALIAS: clipcartel
          KEY_PASSWORD: clipcartel
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk NeonClip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: NeonClip.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run from source self-test
        run: python -m neonclip.main --selftest
      - name: Stamp build number
        run: echo "BUILD = ${{ github.run_number }}" > agent/_build.py
      - name: Package
        run: >
          pyinstaller --noconfirm --windowed --name NeonClip --icon assets/icon.ico
          --add-data "assets;assets"
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all playwright
          --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all av --collect-all edge_tts --collect-all certifi
          --hidden-import tkinter run_agent.py
      - name: Add editable source code
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/NeonClip/source | Out-Null
          Copy-Item -Recurse agent, ytauto, neonclip, assets, run_agent.py, requirements.txt, README.md dist/NeonClip/source/
          Copy-Item scripts/*.bat dist/NeonClip/source/
      - name: Packaged self-test
        shell: pwsh
        run: |
          $p = Start-Process dist/NeonClip/NeonClip.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/NeonClip -DestinationPath NeonClip-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: NeonClip-Windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: NeonClip V2 (v2.0.${{ github.run_number }})
          make_latest: true
          body: |
            **NeonClip-Windows.zip**: the PC app (Clipping + YouTube sections). Unzip anywhere, open `NeonClip.exe`.
            **NeonClip.apk**: the phone app (Android). Install it, then enter the topic and pairing code from NeonClip → PHONE.
          files: |
            NeonClip.apk
            NeonClip-Windows.zip
